version: '3.8'

services:
  # 后端 API 服务
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: edulingua-backend
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../memories:/app/memories
      - ../logs:/app/logs
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: edulingua-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: edulingua-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
