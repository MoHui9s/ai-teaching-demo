[project]
name = "hermes-agent"
version = "0.1.0"
description = "Minimal AI Agent with Persistent Memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "python-dotenv>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "edge-tts>=7.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
