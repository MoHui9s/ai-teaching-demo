[project]
name = "hermes-agent"
version = "0.1.0"
description = "Minimal AI Agent with Persistent Memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "python-dotenv>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
