[project]
name = "tan-english-tutor"
version = "0.1.0"
description = "Tan同学-AI英语助教 — AI驱动的全栈英语学习系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "python-dotenv>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "edge-tts>=7.2.8",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.5.0",
    "openai>=1.0.0",
    "apscheduler>=3.10.0",
    # azure-cognitiveservices-speech 为可选依赖（发音评估需要）
    # 安装: pip install azure-cognitiveservices-speech
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
