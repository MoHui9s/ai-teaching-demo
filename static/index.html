<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Agent Chat</title>
    <script type="module" crossorigin src="/assets/index-B6Gsmx8X.js"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="user-controls">
          <label for="user-id">Current User</label>
          <input type="text" id="user-id" placeholder="Enter user ID" value="default" />
          <button id="switch-user">Switch</button>
          <button id="new-user">+ New User</button>
        </div>
        <div id="user-list"></div>
        <div id="sidebar-actions">
          <button id="load-history"><span class="btn-icon">&#8635;</span> Load History</button>
          <button id="clear-history"><span class="btn-icon">&#128465;</span> Clear History</button>
          <button id="dark-mode"><span class="btn-icon">&#127769;</span> Dark Mode</button>
        </div>
      </aside>
      <main id="chat-area">
        <div id="messages">
          <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-icon">&#9889;</div>
            <h1>Welcome to Hermes</h1>
            <h2>Your Personal AI Assistant</h2>
            <p>Start a conversation below. Hermes remembers your context and can perform complex tasks with persistent memory.</p>
            <div class="welcome-features">
              <span class="welcome-feature">Persistent Memory</span>
              <span class="welcome-feature">Multi-User</span>
              <span class="welcome-feature">Markdown</span>
              <span class="welcome-feature">Code Highlighting</span>
            </div>
          </div>
        </div>
        <div id="input-area">
          <div class="input-wrapper">
            <textarea id="message-input" placeholder="Type a message... (Enter to send, Shift+Enter for new line)" rows="2"></textarea>
            <div id="input-buttons">
              <span class="char-count" id="char-count"></span>
              <button id="stop-generation" style="display:none">Stop</button>
              <button id="send-message">Send</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="toast-container"></div>
  </body>
</html>
